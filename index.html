<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiesta de la Luz · Provincia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --noche: #000000;
    --tinta: #f6f1e7;
    --tenue: rgba(246, 241, 231, 0.62);
    --hilo: rgba(246, 241, 231, 0.16);
    --vela: #ffd28a;
    --gutter: clamp(16px, 3vw, 52px);
    --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --ui: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--noche); }
  body { overflow: hidden; color: var(--tinta); font-family: var(--ui); font-weight: 300; -webkit-font-smoothing: antialiased; }
  #escenario { position: fixed; inset: 0; background: var(--noche); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #escenario.sin-cursor { cursor: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #luz { mix-blend-mode: screen; }

  /* Recuento abajo */
  #recuento {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: clamp(28px, 6vh, 70px) calc(var(--gutter) + env(safe-area-inset-right, 0px)) calc(var(--gutter) * .7 + env(safe-area-inset-bottom, 0px)) calc(var(--gutter) + env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.92) 55%, rgba(0,0,0,0));
    display: flex; align-items: flex-end;
    transition: opacity 1s ease;
  }
  #recuento.oculto { opacity: 0; }
  .total b { display: block; font: 500 clamp(54px, 6.4vw, 120px)/.9 var(--display); color: var(--vela); font-variant-numeric: tabular-nums lining-nums; text-shadow: 0 0 30px rgba(255,170,80,.5); }
  .total span { display: block; margin-top: 6px; font-size: clamp(11px, .85vw, 15px); letter-spacing: .22em; text-transform: uppercase; color: var(--tenue); }
  .lista { min-width: 0; }
  .lista h3 small { margin-left: 6px; font-weight: 400; letter-spacing: .06em; color: var(--tenue); }
  .lista li.otras .n, .lista li.otras .c { color: var(--tenue); font-weight: 300; }
  #tabla { position: absolute; inset: 0; z-index: 5; overflow: auto; background: rgba(0,0,0,.94); padding: calc(var(--gutter) + env(safe-area-inset-top, 0px)) var(--gutter) var(--gutter); }
  .tabla-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; margin-bottom: 18px; }
  .tabla-cab h2 { margin: 0; font: italic 500 clamp(28px, 3vw, 48px)/1 var(--display); }
  .tabla-cab p { margin: 0; color: var(--tenue); font-size: clamp(14px, 1.1vw, 18px); }
  .tabla-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px 48px; }
  .tabla-cols h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--vela); }
  .tabla-cols table { width: 100%; border-collapse: collapse; font-size: clamp(14px, 1vw, 18px); }
  .tabla-cols td { padding: 5px 0; border-bottom: 1px solid var(--hilo); }
  .tabla-cols td:last-child { text-align: right; color: var(--vela); font-variant-numeric: tabular-nums; font-weight: 500; }
  .tabla-cols tr.suma td { border-bottom: 0; padding-top: 10px; color: var(--tinta); font-weight: 500; }
  .lista h3 { margin: 0 0 6px; font-size: clamp(11px, .8vw, 14px); font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--vela); }
  .lista ol { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; justify-content: space-between; gap: 12px; padding: clamp(2px, .45vh, 6px) 0; border-bottom: 1px solid var(--hilo); font-size: clamp(14px, 1.15vw, 22px); }
  .lista li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lista li .c { font-variant-numeric: tabular-nums; color: var(--vela); font-weight: 500; }
  .lista li.sube { animation: brillo 1.6s ease; }
  @keyframes brillo { from { background: rgba(255, 200, 120, .22); } to { background: transparent; } }

  #prueba {
    position: absolute; left: calc(var(--gutter) + env(safe-area-inset-left, 0px)); top: calc(var(--gutter) + env(safe-area-inset-top, 0px));
    margin: 0; padding: 6px 12px; border: 1px dashed rgba(255,210,138,.5); border-radius: 999px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--vela);
  }
  #cartel {
    position: absolute; left: 50%; top: calc(var(--gutter) + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    margin: 0; text-align: center; opacity: 0; transition: opacity 1.4s ease; pointer-events: none;
  }
  #cartel.visible { opacity: 1; }
  #cartel small { display: block; font-size: clamp(11px, .85vw, 15px); letter-spacing: .24em; text-transform: uppercase; color: var(--vela); }
  #cartel b { display: block; margin-top: 4px; font: italic 500 clamp(30px, 3.6vw, 64px)/1 var(--display); font-weight: 500; text-shadow: 0 0 30px rgba(255,190,110,.4), 0 0 20px #000; }

  /* Créditos del final */
  #creditos { position: absolute; inset: 0; z-index: 4; overflow: hidden; background: rgba(0,0,0,0); transition: background 2.5s ease; }
  #creditos.visible { background: rgba(0,0,0,.82); }
  #creditos-rollo { position: absolute; left: 50%; top: 0; width: min(1100px, calc(100% - 2 * var(--gutter))); transform: translate(-50%, 100vh); text-align: center; }
  #creditos-rollo h2 { margin: 0; font: italic 500 clamp(56px, 7vw, 130px)/1 var(--display); text-shadow: 0 0 40px rgba(255,190,110,.4); }
  #creditos-rollo .resumen { margin: 14px 0 0; font-size: clamp(15px, 1.3vw, 22px); letter-spacing: .08em; color: var(--tenue); }
  #creditos-rollo h3 { margin: clamp(56px, 9vh, 110px) 0 6px; font-size: clamp(12px, 1vw, 16px); font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--vela); }
  #creditos-rollo h4 { margin: 26px 0 8px; font: italic 500 clamp(24px, 2.3vw, 40px)/1.1 var(--display); color: var(--tinta); }
  #creditos-rollo .grupo { columns: 3 260px; column-gap: 48px; text-align: left; }
  #creditos-rollo .fila { display: flex; justify-content: space-between; gap: 16px; break-inside: avoid; padding: 5px 0; border-bottom: 1px solid var(--hilo); font-size: clamp(15px, 1.25vw, 22px); }
  #creditos-rollo .fila b { font-weight: 500; color: var(--vela); font-variant-numeric: tabular-nums; }
  #creditos-rollo .lejos .grupo { columns: 1; max-width: 560px; margin: 0 auto; }
  #creditos-rollo .lejos h4 { margin-top: 34px; }
  #creditos-rollo .lejos .fila { font-size: clamp(18px, 1.6vw, 28px); }
  #creditos-rollo .cierre { margin: clamp(80px, 14vh, 160px) 0 0; padding-bottom: 6vh; }
  #creditos-rollo .cierre p { margin: 0; font: italic 500 clamp(34px, 4vw, 72px)/1.1 var(--display); text-wrap: balance; }
  #creditos-rollo .cierre small { display: block; margin-top: 14px; font-size: clamp(12px, 1vw, 16px); letter-spacing: .24em; text-transform: uppercase; color: var(--vela); }

  @media (orientation: portrait) {
    #recuento .total { display: flex; align-items: baseline; gap: 10px; }
    .total b { font-size: 44px; }
    .lista li { font-size: 13px; }
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; animation: none !important; } }
</style>
</head>
<body>
<div id="escenario">
  <canvas id="base" aria-hidden="true"></canvas>
  <canvas id="luz" role="img" aria-label="Mapa de la provincia de Buenos Aires que se llena de luces; al final todas van hacia la Iglesia Rajem."></canvas>

  <p id="prueba" hidden>Modo de prueba · datos de ejemplo</p>
  <p id="cartel" aria-live="polite"><small id="cartel-sub"></small><b id="cartel-titulo"></b></p>

  <section id="recuento" class="oculto" aria-live="polite">
    <div class="total"><b id="n-total">0</b><span>luces encendidas</span></div>
  </section>

  <!-- Final: recuento completo que pasa como los créditos de una película -->
  <section id="creditos" hidden aria-live="polite">
    <div id="creditos-rollo"></div>
  </section>

  <section id="tabla" hidden aria-label="Recuento completo">
    <div class="tabla-cab"><h2>Recuento completo</h2><p id="tabla-resumen"></p></div>
    <div class="tabla-cols">
      <div><h3>Por localidad</h3><table id="t-localidades"></table></div>
      <div><h3>Por iglesia</h3><table id="t-iglesias"></table></div>
    </div>
  </section>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/provincia.js"></script>
<script src="lib/localidades-ba.js"></script>
<script src="lib/rajem.js"></script>
<script src="lib/provincias-ar.js"></script>
<script src="lib/localidades-ar.js"></script>
<script src="luces-provincia.js"></script>
<script>
(function () {
  "use strict";
  const C = window.LUCES_PROVINCIA;
  const geo = window.PROVINCIA_GEO;
  const LOC = window.LOCALIDADES_BA;
  const IG = C.iglesia;
  const $ = (id) => document.getElementById(id);
  const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const OTRO_LUGAR = "Otro lugar (fuera de la provincia)";   // respuestas del formulario anterior
  const OTRO_PAIS = "Otro país";
  const AR = window.LOCALIDADES_AR.provincias;
  const GRUPO_BA = "Provincia de Buenos Aires", GRUPO_CABA = "Ciudad de Buenos Aires", GRUPO_PAISES = "Otros países";

  // ── Localidades: coordenadas por partido y localidad ──────
  const clave = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const lugares = new Map();
  const centroPartido = new Map();
  for (const p of LOC.partidos) {
    let la = 0, lo = 0;
    for (const l of p.loc) { lugares.set(clave(p.p) + "|" + clave(l.n), { lat: l.lat, lon: l.lon, nombre: l.n }); la += l.lat; lo += l.lon; }
    centroPartido.set(clave(p.p), { lat: la / p.loc.length, lon: lo / p.loc.length, nombre: p.p, unica: p.loc.length === 1 ? p.loc[0] : null });
  }
  // Nombres de localidad que se repiten en más de un partido (p. ej. "Del Viso": Pilar y José C. Paz):
  // se muestran con el partido para que el recuento no tenga dos filas con el mismo nombre.
  const partidosPorNombre = new Map();
  for (const p of LOC.partidos) for (const l of p.loc) {
    const k = clave(l.n);
    partidosPorNombre.set(k, (partidosPorNombre.get(k) || new Set()).add(p.p));
  }
  const nombreLugar = (loc, partido) => (partidosPorNombre.get(clave(loc)) || new Set()).size > 1 ? `${loc} (${partido})` : loc;
  const limpio = (t, max) => String(t || "").replace(/\s+/g, " ").trim().slice(0, max || 50);
  const esCABA = (t) => clave(t).startsWith("ciudad autonoma");
  const CABA = { lat: -34.6037, lon: -58.3816, nombre: "Ciudad Autónoma de Buenos Aires", grupo: GRUPO_CABA };
  // Ciudad de otra provincia: se busca en la lista oficial; si no está, la luz va al centro de la provincia
  function ubicarCiudad(prov, ciudad) {
    const P = AR[prov];
    if (!P) return null;
    const c = clave(ciudad).replace(/[^a-z0-9ñ ]+/g, " ").replace(/\s+/g, " ").trim();
    const m = (c && P.loc.find((l) => clave(l[0]) === c)) ||
      (c.length >= 4 && P.loc.find((l) => clave(l[0]).startsWith(c))) ||
      (c.length >= 5 && P.loc.find((l) => clave(l[0]).includes(c)));
    const nombre = m ? m[0] : (limpio(ciudad, 40) || prov);
    return { lat: m ? m[1] : P.centro[0], lon: m ? m[2] : P.centro[1], nombre: `${nombre} (${prov})`, grupo: prov, prov };
  }
  // f = { provincia, partido, localidad, ciudad, pais } tal como vienen del formulario
  function ubicar(f) {
    const prov = limpio(f.provincia, 80);
    if (prov === OTRO_PAIS || f.partido === OTRO_LUGAR) return { fuera: true, nombre: limpio(f.pais, 50) || "Otro país", grupo: GRUPO_PAISES };
    if (esCABA(prov) || esCABA(f.partido)) return Object.assign({}, CABA);
    if (prov && clave(prov) !== "buenos aires") return ubicarCiudad(prov, f.ciudad);
    const u = ubicarBA(f.partido, f.localidad);
    if (u) u.grupo = GRUPO_BA;
    return u;
  }
  function ubicarBA(partido, localidad) {
    if (!partido) return null;
    const cp = centroPartido.get(clave(partido));
    if (!cp) return null;
    if (!localidad && cp.unica) return { lat: cp.unica.lat, lon: cp.unica.lon, nombre: nombreLugar(cp.unica.n, cp.nombre) };
    if (!localidad || /^otra localidad/i.test(localidad)) return { lat: cp.lat, lon: cp.lon, nombre: `${cp.nombre} (otra localidad)` };
    const l = lugares.get(clave(partido) + "|" + clave(localidad));
    return l ? { lat: l.lat, lon: l.lon, nombre: nombreLugar(l.nombre, cp.nombre) } : { lat: cp.lat, lon: cp.lon, nombre: `${cp.nombre} (otra localidad)` };
  }
  // la misma iglesia aunque esté escrita distinto ("Iglesia Rajem", "rajem", "RAJEM.")
  const claveIglesia = (s) => clave(s).replace(/[^a-z0-9ñ ]+/g, " ").replace(/\b(iglesia|iglesias|evangelica|cristiana|ministerio|la|el|de)\b/g, " ").replace(/\s+/g, " ").trim() || clave(s);

  // ── Mapa ──────────────────────────────────────────────────
  const escenario = $("escenario"), base = $("base"), luz = $("luz");
  const bctx = base.getContext("2d"), lctx = luz.getContext("2d");
  const obj = geo.objects.partidos;
  const capas = {
    contorno: topojson.mesh(geo, obj, (a, b) => a === b),
    limites: topojson.mesh(geo, obj, (a, b) => a !== b && a.properties.prov === "06" && b.properties.prov === "06"),
    comunas: topojson.mesh(geo, obj, (a, b) => a !== b && (a.properties.prov === "02" || b.properties.prov === "02"))
  };
  // Calles alrededor de la iglesia (OpenStreetMap). Como en el otro mapa, se calculan relativas a las
  // coordenadas exactas de Rajem (×LOCAL) para que se vean bien con el zoom máximo.
  const R = window.RAJEM_GEO;
  const callesGeo = {};
  if (R) for (const k of ["avenidas", "calles", "vias"]) callesGeo[k] = topojson.feature(R, R.objects[k]);
  const LOCAL = 1e4;
  let origen = [0, 0], trazosCalles = {};
  const PROVINCIA = [-63.5, -41.1, -56.6, -33.2];
  const PA = window.PROVINCIAS_AR;
  const provFeat = new Map(topojson.feature(PA, PA.objects.provincias).features.map((f) => [f.properties.nombre, f]));
  const provVisibles = new Map();   // provincia → momento en que apareció
  let trazosProv = {};
  // lo que se ve: Buenos Aires más las provincias que ya tienen alguna luz
  function rangoVisible() {
    let [o, s, e, n] = PROVINCIA;
    for (const nombre of provVisibles.keys()) {
      const f = provFeat.get(nombre);
      if (!f) continue;
      const [[a, b], [c, d]] = d3.geoBounds(f);
      o = Math.min(o, a); s = Math.min(s, b); e = Math.max(e, c); n = Math.max(n, d);
    }
    return [o, s, e, n];
  }

  let W, H, dpr, proj, trazos = {}, pxKm = 1;
  let cam = [0, 0, 1], vuelo = null, baseSucia = true, claveBase = "";
  let proyector = false;
  try { proyector = localStorage.getItem("fdl-proyector") === "1"; } catch (e) { /* sin almacenamiento */ }
  const pr = (a, b) => (proyector ? b : a);
  const aparece = (km, desde, hasta) => Math.max(0, Math.min(1, (desde - km) / (desde - hasta)));

  // alto que queda libre arriba del recuento
  const libreAlto = () => Math.max(H * 0.5, $("recuento").getBoundingClientRect().top - 8);
  // el mapa se encuadra entre el cartel de arriba y el recuento de abajo
  function vistaDe([o, s, e, n]) {
    const a = proj([o, n]), b = proj([e, s]);
    const arriba = Math.min(H * 0.16, 150);
    const lh = libreAlto() - arriba;
    const w = Math.max(b[0] - a[0], (b[1] - a[1]) * W / lh) * 1.1;
    const k = W / w;
    return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + (H - lh - 2 * arriba) / 2 / k, w];
  }
  function vistaKm(lat, lon, km) {
    const dlon = km / 2 / (111.32 * Math.cos(lat * Math.PI / 180)), dlat = km / 2 / 110.57 * 0.6;
    return vistaDe([lon - dlon, lat - dlat, lon + dlon, lat + dlat]);
  }
  let objetivo = "";
  function volarA(v, ms) {
    const k = v.map((x) => x.toFixed(1)).join(",");
    if (k === objetivo) return;
    objetivo = k;
    if (reducir) { cam = v; vuelo = null; baseSucia = true; return; }
    const interp = d3.interpolateZoom(cam.slice(), v);
    vuelo = { interp, t0: performance.now(), dur: ms || Math.min(3000, Math.max(1400, interp.duration * 0.8)) };
  }

  function redimensionar() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [base, luz]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    proj = d3.geoMercator().fitSize([W, H], { type: "Feature", geometry: { type: "Polygon", coordinates: [[[PROVINCIA[0], PROVINCIA[1]], [PROVINCIA[2], PROVINCIA[1]], [PROVINCIA[2], PROVINCIA[3]], [PROVINCIA[0], PROVINCIA[3]], [PROVINCIA[0], PROVINCIA[1]]]] } });
    const ruta = d3.geoPath(proj);
    for (const k in capas) trazos[k] = new Path2D(ruta(capas[k]));
    trazosProv = {};
    for (const [nombre, f] of provFeat) trazosProv[nombre] = new Path2D(ruta(f));
    origen = proj([IG.lon, IG.lat]);
    const relativa = d3.geoTransform({ point(x, y) { const q = proj([x, y]); this.stream.point((q[0] - origen[0]) * LOCAL, (q[1] - origen[1]) * LOCAL); } });
    const rl = d3.geoPath(relativa);
    for (const k in callesGeo) trazosCalles[k] = new Path2D(rl(callesGeo[k]));
    const a = proj([IG.lon, IG.lat]), b = proj([IG.lon + 0.05, IG.lat]);
    pxKm = Math.abs(b[0] - a[0]) / (0.05 * 111.32 * Math.cos(IG.lat * Math.PI / 180));
    for (const l of luces) proyectar(l);
    objetivo = "";
    cam = fase === "cuadra" || fase === "fin" || fase === "creditos" ? vistaKm(IG.lat, IG.lon, 0.7)
      : fase === "viaje" || fase === "partido" ? vistaKm(IG.lat, IG.lon, 16) : vistaDe(rangoVisible());
    vuelo = null; baseSucia = true;
  }

  function dibujarBase() {
    const c = cam.join(",") + proyector;
    if (!baseSucia && c === claveBase) return;
    claveBase = c; baseSucia = false;
    const k = W / cam[2];
    const km = cam[2] / pxKm;
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.fillStyle = "#000"; bctx.fillRect(0, 0, base.width, base.height);
    bctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (W / 2 - cam[0] * k), dpr * (H / 2 - cam[1] * k));
    bctx.lineJoin = "round"; bctx.lineCap = "round"; bctx.strokeStyle = "#fff";
    const linea = (t, a, w, guiones) => { if (a <= 0 || !trazos[t]) return; bctx.globalAlpha = Math.min(1, a); bctx.lineWidth = w / k; bctx.setLineDash(guiones ? guiones.map((g) => g / k) : []); bctx.stroke(trazos[t]); };
    linea("limites", pr(0.32, 0.6), pr(0.7, 1.4));
    linea("comunas", pr(0.18, 0.4), pr(0.5, 1));
    linea("contorno", 0.95, pr(1.3, 2.4));
    // provincias de quienes vinieron de lejos: aparecen de a poco
    const ahoraMs = performance.now();
    for (const [nombre, t0] of provVisibles) {
      if (!trazosProv[nombre]) continue;
      const a = Math.max(0, Math.min(1, (ahoraMs - t0) / 1600));
      if (a < 1) baseSucia = true;
      bctx.globalAlpha = 0.9 * a; bctx.lineWidth = pr(1.3, 2.4) / k; bctx.setLineDash([]);
      bctx.stroke(trazosProv[nombre]);
    }
    // calles alrededor de Rajem: aparecen al acercarse (dibujadas relativas a la iglesia)
    if (km < 20) {
      const kl = k / LOCAL;
      bctx.setTransform(dpr * kl, 0, 0, dpr * kl, dpr * (W / 2 + (origen[0] - cam[0]) * k), dpr * (H / 2 + (origen[1] - cam[1]) * k));
      const calle = (t, a, w, guiones) => {
        if (a <= 0 || !trazosCalles[t]) return;
        bctx.globalAlpha = Math.min(1, a); bctx.lineWidth = w / kl;
        bctx.setLineDash(guiones ? guiones.map((g) => g / kl) : []);
        bctx.stroke(trazosCalles[t]);
      };
      calle("avenidas", pr(0.9, 1) * aparece(km, 11, 4.5), pr(1.3, 2.3));
      calle("vias", pr(0.6, 0.9) * aparece(km, 10, 4), pr(1, 1.8), [5, 4]);
      calle("calles", pr(0.42, 0.65) * aparece(km, 6, 2.5), pr(0.7, 1.3));
    }

  // ── Luces ─────────────────────────────────────────────────
  function sprite(intensidad) {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, 128, 128);
    g.globalAlpha = intensidad;
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, "rgba(255,252,240,1)");
    r.addColorStop(0.07, "rgba(255,240,205,0.95)");
    r.addColorStop(0.2, "rgba(255,200,120,0.5)");
    r.addColorStop(0.45, "rgba(255,150,60,0.14)");
    r.addColorStop(1, "rgba(255,120,30,0)");

  const brillo = sprite(1), halo = sprite(0.2), haloRajem = sprite(0.5);

  let luces = [];          // una por respuesta
  const vistos = new Set();
  const KM = 1 / 110.57;
  function agregar(id, f) {
    if (vistos.has(id)) return;
    const u = ubicar(f);
    let iglesia = f.iglesia;
    iglesia = String(iglesia || "").replace(/\s+/g, " ").trim().slice(0, 60);
    if (!u || !iglesia) return;
    vistos.add(id);
    luces.push({
      id, iglesia, resp: f, grupo: u.grupo, prov: u.prov || null, lugar: (u.fuera ? "pais|" : "") + clave(u.nombre), lugarNombre: u.nombre,
      lat0: u.fuera ? null : u.lat, lon0: u.fuera ? null : u.lon, lat: null, lon: null, p: null,
      f: 0.7 + Math.random() * 0.6, fase: Math.random() * 6.28, t: null, retraso: Math.random()
    });
  }
  // las luces de una misma localidad se acomodan en espiral
  function colocar() {
    const porLugar = new Map();
    for (const l of luces) {
      if (l.lat0 == null) continue;
      const i = porLugar.get(l.lugar) || 0;
      porLugar.set(l.lugar, i + 1);
      const r = 0.38 * Math.sqrt(i), a = i * 2.39996;
      l.la = l.lat0 + r * Math.sin(a) * KM;
      l.lo = l.lon0 + r * Math.cos(a) * KM / Math.cos(l.lat0 * Math.PI / 180);
      l.lat = l.la; l.lon = l.lo;
      proyectar(l);
    }
  }
  function proyectar(l) { if (l.lat != null && proj) l.p = proj([l.lon, l.lat]); }

  // ── Línea de tiempo ───────────────────────────────────────
  // esperando → llenando → pausa → rajem → viaje → fin
  let progresoViaje = 0;     // cuánto avanzaron (en promedio) las luces hacia Rajem
  let fase = "esperando", indice = 0, proximo = 0, tFase = 0, llegadas = 0;
  const ahoraS = () => performance.now() / 1000;
  function intervalo() {
    const total = luces.length || 1;
    return Math.max(0.06, Math.min(0.7, (C.duracionLlenado || 30) / total));
  }
  function empezar() {
    if (fase !== "esperando") return;
    fase = "llenando"; proximo = ahoraS() + 1.2; tFase = ahoraS();
    $("recuento").classList.remove("oculto");
    arrancarMusica();
  }
  // Etapas del final (como el acercamiento del otro mapa):
  //  rajem  → Rajem se resalta sobre la provincia (sin zoom)
  //  viaje  → las luces vuelan a Rajem mientras la cámara se acerca a José C. Paz
  //  cuadra → la cámara baja hasta la cuadra de la iglesia (sus coordenadas exactas)
  const ETAPAS = { rajem: 3.2, viaje: 5, pausaPartido: 1.6, cuadra: 3.6 };
  function avanzar() {
    const t = ahoraS();
    if (fase === "llenando" && t >= proximo) {
      const pendientes = luces.filter((l) => l.t === null);
      if (pendientes.length) {
        const l = pendientes[0];
        l.t = performance.now();
        recontar(l);
        // primera luz de otra provincia: se dibuja esa provincia y la cámara se abre para mostrarla
        if (l.prov && !provVisibles.has(l.prov) && provFeat.has(l.prov)) {
          provVisibles.set(l.prov, performance.now());
          baseSucia = true;
          volarA(vistaDe(rangoVisible()), 2600);
        }
        proximo = t + intervalo();
      } else if (!C.planilla || listoPlanilla) {
        fase = "pausa"; proximo = t + (C.pausaAntesDeRajem || 2.5);
      }
    }
    if (fase === "pausa" && t >= proximo) {
      fase = "rajem"; tFase = t; proximo = t + ETAPAS.rajem;
      cartel("La luz llega a casa", IG.nombre);
    }
    if (fase === "rajem" && t >= proximo) {
      fase = "viaje"; tFase = t;
      for (const l of luces) l.retraso = Math.random() * 0.3;
      volarA(vistaKm(IG.lat, IG.lon, 16), ETAPAS.viaje * 1000);
      cartel("Partido de José C. Paz", "José C. Paz");
    }
    if (fase === "viaje" || fase === "partido" || fase === "cuadra" || fase === "fin") {
      let llegaron = 0, suma = 0, cuantas = 0;
      for (const l of luces) {
        if (l.lat0 == null || l.t === null) continue;
        const u = Math.max(0, Math.min(1, ((t - tFase) / ETAPAS.viaje - l.retraso) / (1 - 0.3)));
        const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
        l.lat = l.la + (IG.lat - l.la) * e;
        l.lon = l.lo + (IG.lon - l.lo) * e;
        proyectar(l);
        if (u >= 1) llegaron++;
        suma += e; cuantas++;
      }
      llegadas = llegaron;
      progresoViaje = cuantas ? suma / cuantas : 1;   // 0 al salir, 1 cuando llegaron todas
    }
    if (fase === "viaje" && t - tFase >= ETAPAS.viaje) { fase = "partido"; proximo = t + ETAPAS.pausaPartido; }
    if (fase === "partido" && t >= proximo) {
      fase = "cuadra"; proximo = t + ETAPAS.cuadra;
      volarA(vistaKm(IG.lat, IG.lon, 0.7), ETAPAS.cuadra * 1000);
      cartel(IG.direccion, IG.nombre);
    }
    if (fase === "cuadra" && t >= proximo) { fase = "fin"; proximo = t + (C.pausaAntesDelRecuento || 4); }
    if (fase === "fin" && t >= proximo) { fase = "creditos"; mostrarCreditos(); }
  }
  function cartel(sub, titulo) {
    $("cartel-sub").textContent = sub || "";
    $("cartel-titulo").textContent = titulo || "";
    $("cartel").classList.add("visible");
  }

  function dibujarLuces(ahora) {
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.globalCompositeOperation = "source-over";
    lctx.fillStyle = "#000"; lctx.fillRect(0, 0, W, H);
    const k = W / cam[2];
    const ox = W / 2 - cam[0] * k, oy = H / 2 - cam[1] * k;
    const escala = Math.min(1.5, 0.7 + 0.12 * Math.log2(k + 1)) * Math.min(1, Math.max(0.6, W / 1500)) * pr(1, 1.3);
    const s = ahora / 1000;
    for (const l of luces) {
      if (!l.p || l.t === null) continue;
      const x = l.p[0] * k + ox, y = l.p[1] * k + oy;
      if (x < -150 || y < -150 || x > W + 150 || y > H + 150) continue;
      const edad = (ahora - l.t) / 1000;
      const parpadeo = 1 + 0.07 * Math.sin(s * 3.1 * l.f + l.fase);
      const destello = reducir || edad > 1.1 ? 0 : 2.2 * Math.pow(1 - edad / 1.1, 2);
      lctx.globalCompositeOperation = "lighten";
      const rh = 70 * escala;
      lctx.drawImage(halo, x - rh, y - rh, rh * 2, rh * 2);
      const r = 13 * escala * parpadeo * (1 + destello);
      lctx.drawImage(brillo, x - r, y - r, r * 2, r * 2);
      if (!reducir && edad < 1.6) {
        lctx.globalCompositeOperation = "lighter";
        lctx.globalAlpha = 0.5 * (1 - edad / 1.6);
        lctx.strokeStyle = "rgb(255,214,150)"; lctx.lineWidth = 1.4;
        lctx.beginPath(); lctx.arc(x, y, 5 + edad * 80 * escala, 0, Math.PI * 2); lctx.stroke();
        lctx.globalAlpha = 1;
      }
    }

    // Rajem: faro con ondas, cada vez más fuerte a medida que llegan las luces
    if (fase === "rajem" || fase === "viaje" || fase === "partido" || fase === "cuadra" || fase === "fin" || fase === "creditos") {
      const p = proj([IG.lon, IG.lat]);
      const x = p[0] * k + ox, y = p[1] * k + oy;
      const entrada = Math.min(1, (s - tFaseRajem()) / 1.2);
      // la luz de Rajem crece a medida que las luces llegan: núcleo hasta ~3×, resplandor hasta ~2×
      const fuerza = 1 + 2.2 * progresoViaje;
      const fuerzaHalo = 1 + 1.1 * progresoViaje;
      lctx.globalCompositeOperation = "lighten";
      const rh = 120 * escala * fuerzaHalo * entrada;
      lctx.drawImage(haloRajem, x - rh, y - rh, rh * 2, rh * 2);
      const r = 24 * escala * fuerza * entrada * (1 + 0.06 * Math.sin(s * 2.4));
      lctx.drawImage(brillo, x - r, y - r, r * 2, r * 2);
      lctx.globalCompositeOperation = "lighter";
      for (let j = 0; j < 2; j++) {
        const f = ((s + j * 0.9) % 1.8) / 1.8;
        lctx.globalAlpha = 0.7 * (1 - f) * entrada;

        lctx.beginPath(); lctx.arc(x, y, 10 + f * 100 * escala * fuerzaHalo, 0, Math.PI * 2); lctx.stroke();
      }
      lctx.globalAlpha = entrada;
      lctx.globalCompositeOperation = "source-over";
      const tam = Math.round(Math.max(18, Math.min(34, W / 52)));
      lctx.font = `italic 500 ${tam}px "Cormorant Garamond", Georgia, serif`;
      lctx.textBaseline = "middle"; lctx.textAlign = "left";
      lctx.lineJoin = "round"; lctx.lineWidth = 5; lctx.strokeStyle = "rgba(0,0,0,.88)";
      lctx.strokeText(IG.nombre, x + r + 14, y);

    }

    if (fase === "llenando" || fase === "pausa") {
      lctx.globalCompositeOperation = "source-over";
      const tam = Math.round(Math.max(12, Math.min(17, W / 105)) * pr(1, 1.15));
      lctx.font = `500 ${tam}px Jost, "Century Gothic", system-ui, sans-serif`;
      lctx.textBaseline = "middle";
      const cajas = [];
      const libreY = libreAlto();
      for (const g of rankingLugares.slice(0, 12)) {
        if (g.lat == null) continue;
        const p = proj([g.lon, g.lat]);
        const x = p[0] * k + ox, y = p[1] * k + oy;
        if (x < 0 || y < 0 || x > W || y > libreY) continue;
        const texto = `${/^Ciudad Autónoma/.test(g.nombre) ? "CABA" : g.nombre} · ${g.n}`;
        const w = lctx.measureText(texto).width;
        const izq = x + 22 + w > W - 12;
        const c = izq ? { x0: x - 22 - w, x1: x - 16, y0: y - tam, y1: y + tam } : { x0: x + 16, x1: x + 22 + w, y0: y - tam, y1: y + tam };
        if (cajas.some((o) => !(c.x1 < o.x0 || c.x0 > o.x1 || c.y1 < o.y0 || c.y0 > o.y1))) continue;

        lctx.lineJoin = "round"; lctx.lineWidth = 4; lctx.strokeStyle = "rgba(0,0,0,.85)";

      }

    }
  }
  let inicioRajem = null;

  // ── Recuento (solo de las luces ya encendidas) ────────────
  let rankingLugares = [], rankingIglesias = [];
  function recontar(nueva) {
    const igl = new Map(), lug = new Map();
    let total = 0;
    for (const l of luces) {
      if (l.t === null) continue;
      total++;
      const ki = claveIglesia(l.iglesia);
      const gi = igl.get(ki) || { n: 0, nombres: new Map(), k: ki };
      gi.n++; gi.nombres.set(l.iglesia, (gi.nombres.get(l.iglesia) || 0) + 1);
      igl.set(ki, gi);
      const gl = lug.get(l.lugar) || { n: 0, nombre: l.lugarNombre, lat: l.lat0, lon: l.lon0, k: l.lugar, grupo: l.grupo };
      gl.n++; lug.set(l.lugar, gl);
    }
    rankingIglesias = [...igl.values()].map((g) => ({ k: g.k, n: g.n, nombre: [...g.nombres.entries()].sort((a, b) => b[1] - a[1])[0][0] }))
      .sort((a, b) => b.n - a.n || a.nombre.localeCompare(b.nombre, "es"));
    rankingLugares = [...lug.values()].sort((a, b) => b.n - a.n || a.nombre.localeCompare(b.nombre, "es"));
    totalEncendidas = total;
    $("n-total").textContent = total;

  }
  let totalEncendidas = 0;
  // ── Créditos del final: el recuento completo, para agradecer a cada uno ──
  function mostrarCreditos() {
    const rollo = $("creditos-rollo");
    rollo.replaceChildren();
    const el = (tag, txt, clase) => { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (clase) e.className = clase; return e; };
    const filas = (lista) => {
      const g = el("div", null, "grupo");

      return g;
    };
    rollo.append(el("h2", "Gracias"));
    const otros = rankingLugares.filter((g) => g.grupo !== GRUPO_BA && g.grupo !== GRUPO_CABA);
    rollo.append(el("p", `${totalEncendidas} luces · ${rankingLugares.length} lugares · ${rankingIglesias.length} iglesias`, "resumen"));
    // quienes vinieron de otras provincias y de otros países, primero y más grande

      const lejos = el("div", null, "lejos");
      const grupos = [...new Set(otros.map((g) => g.grupo))].sort((a, b) => (a === GRUPO_PAISES) - (b === GRUPO_PAISES) || a.localeCompare(b, "es"));
      for (const gr of grupos) {
        lejos.append(el("h4", gr));
        lejos.append(filas(otros.filter((g) => g.grupo === gr).map((g) => ({ nombre: g.nombre.replace(/ \([^)]*\)$/, ""), n: g.n }))));
      }
      rollo.append(lejos);
    }
    const caba = rankingLugares.filter((g) => g.grupo === GRUPO_CABA);
    const ba = rankingLugares.filter((g) => g.grupo === GRUPO_BA);
    if (ba.length || caba.length) {
      rollo.append(el("h3", "Provincia y Ciudad de Buenos Aires"));
      rollo.append(filas(caba.concat(ba)));

    rollo.append(el("h3", "Iglesias"));
    rollo.append(filas(rankingIglesias));
    const cierre = el("div", null, "cierre");
    cierre.append(el("p", "Gracias por ser parte de la Fiesta de la Luz"), el("small", `${totalEncendidas} luces encendidas`));
    rollo.append(cierre);

    const sec = $("creditos");
    sec.hidden = false;
    $("cartel").classList.remove("visible");      // que no se transparenten detrás
    $("recuento").classList.add("oculto");
    requestAnimationFrame(() => sec.classList.add("visible"));
    // pasa de abajo hacia arriba y termina con el agradecimiento en el centro de la pantalla
    const alto = rollo.offsetHeight, h = innerHeight;

      { duration: reducir ? 1 : Math.max(6000, recorrido / velocidad * 1000), easing: "linear", fill: "forwards", delay: 1500 });
  }

  // Tecla T: tabla con TODAS las localidades e iglesias, para controlar contra la planilla

  // ── Música ────────────────────────────────────────────────

  let silencio = false;

    clearInterval(el._f);
    const ini = el.volume, t0 = performance.now();
    el._f = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / ms); el.volume = Math.max(0, Math.min(1, ini + (destino - ini) * k)); if (k >= 1) clearInterval(el._f); }, 40);
  }

  // Al abrir: si el navegador deja sonar la música, empieza solo; si no, al primer toque o tecla.
  function intentarArranqueSolo() {

    musica.muted = false;
    const r = musica.play();
    if (r && r.then) r.then(() => { musica.pause(); musica.currentTime = 0; empezar(); }).catch(() => { /* espera un toque */ });
  }

  // ── Datos: respuestas del formulario (JSONP) ──────────────
  let listoPlanilla = false, leyendo = false;
  function interpretar(cab, filas) {
    const col = (pred) => cab.findIndex((h) => pred(clave(h)));
    const cProv = col((h) => h.includes("provincia") && h.includes("de que")), cPartido = col((h) => h.includes("partido"));
    const cCiudad = col((h) => h.startsWith("ciudad o localidad")), cPais = col((h) => h.startsWith("pais y ciudad"));
    const cIglesia = col((h) => h.includes("iglesia")), cOcultar = col((h) => h.startsWith("ocultar"));
    const cLoc = cab.map((h, i) => (clave(h).startsWith("localidad") ? i : -1)).filter((i) => i >= 0);
    const v = (r, c) => (c >= 0 ? (r[c] || "").trim() : "");
    return filas.map((r, i) => ({
      id: "f" + (i + 2) + "|" + (r[0] || ""),
      provincia: v(r, cProv), partido: v(r, cPartido), ciudad: v(r, cCiudad), pais: v(r, cPais), iglesia: v(r, cIglesia),
      localidad: (cLoc.map((j) => (r[j] || "").trim()).find(Boolean) || ""),
      oculta: v(r, cOcultar) !== ""
    })).filter((f) => (f.provincia || f.partido) && f.iglesia && !f.oculta);

  function procesar(resp) {
    if (!resp || resp.status === "error") return;
    const t = resp.table || { cols: [], rows: [] };
    const cab = t.cols.map((c) => c.label || "");
    const filas = t.rows.map((r) => (r.c || []).map((x) => (x == null ? "" : String(x.f != null ? x.f : x.v != null ? x.v : ""))));
    if (fase === "esperando" || fase === "llenando") {

  function leer() {

    const espera = setTimeout(fin, 15000);

    s.onerror = fin;
    s.src = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(C.planilla) + "/gviz/tq?tqx=out:json;responseHandler:" + cb +
      "&headers=1&sheet=" + encodeURIComponent(C.hoja || "Respuestas") + "&t=" + Date.now();

  // ── Modo de prueba (sin planilla configurada) ─────────────
  if (!C.planilla) {
    $("prueba").hidden = false;
    const IGL = ["Iglesia Rajem", "Iglesia Rajem", "Iglesia Rajem", "Iglesia Esperanza", "Centro Cristiano Vida", "Iglesia Bautista Central", "Ministerio Luz y Vida", "Comunidad de Fe", "rajem"];
    const BA = (partido, localidad) => ({ provincia: "Buenos Aires", partido, localidad });
    const LUG = [BA("José C. Paz", "José C. Paz"), BA("José C. Paz", "José C. Paz"), BA("José C. Paz", "Tortuguitas"), BA("San Miguel", "San Miguel"), BA("San Miguel", "Bella Vista"),
      BA("Malvinas Argentinas", "Grand Bourg"), BA("Malvinas Argentinas", "Los Polvorines"), BA("Pilar", "Del Viso"), BA("Moreno", "Trujui"), BA("La Matanza", "San Justo"),
      BA("La Plata", "La Plata"), BA("General Pueyrredón", "Mar del Plata"), BA("Bahía Blanca", "Bahía Blanca"), BA("Tigre", "Benavídez"), BA("Quilmes", "Quilmes"),
      { provincia: "Ciudad Autónoma de Buenos Aires" }, BA("José C. Paz", "Del Viso"), BA("Hurlingham", "Hurlingham")];
    const LEJOS = [{ provincia: "Córdoba", ciudad: "Villa María" }, { provincia: "Santa Fe", ciudad: "Rosario" }, { provincia: "Santa Fe", ciudad: "rosario" },
      { provincia: "Misiones", ciudad: "Posadas" }, { provincia: "Mendoza", ciudad: "Godoy Cruz" }, { provincia: "Otro país", pais: "Uruguay, Montevideo" }];
    let semilla = 7;
    const azar = () => (semilla = (semilla * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 70; i++) {
      // las de lejos aparecen repartidas en el medio del llenado
      const f = i % 12 === 6 && LEJOS.length ? LEJOS.shift() : LUG[Math.floor(azar() * LUG.length)];
      agregar("prueba" + i, Object.assign({ iglesia: IGL[Math.floor(azar() * IGL.length)] }, f));
    }
    colocar();
  } else {
    leer();
    setInterval(leer, Math.max(4, C.cadaSegundos || 8) * 1000);
  }

  // ── Animación ─────────────────────────────────────────────
  function cuadro(ahora) {
    avanzar();
    if (vuelo) {
      const t = Math.min(1, (ahora - vuelo.t0) / vuelo.dur);
      cam = vuelo.interp(d3.easeCubicInOut(t));
      baseSucia = true;
      if (t >= 1) vuelo = null;
    }
    dibujarBase();
    dibujarLuces(ahora);
    requestAnimationFrame(cuadro);
  }

  // ── Comandos (ocultos) ────────────────────────────────────
  function pantallaCompleta() {
    const d = document, el = d.documentElement;
    try {
      const r = d.fullscreenElement ? d.exitFullscreen() : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (r && r.catch) r.catch(() => {});
    } catch (e) { /* no disponible */ }
  }
  window.addEventListener("keydown", (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const t = ev.key.toLowerCase();
    if (t === "enter" || t === " ") empezar();
    else if (t === "f") pantallaCompleta();
    else if (t === "r") location.reload();
    else if (t === "p") { proyector = !proyector; baseSucia = true; try { localStorage.setItem("fdl-proyector", proyector ? "1" : "0"); } catch (e) { /* */ } }
    else if (t === "m") { silencio = !silencio; if (musica) musica.muted = silencio; }
    else if (t === "t") { $("tabla").hidden = !$("tabla").hidden; if (!$("tabla").hidden) pintarTabla(); }
    else return;
    ev.preventDefault();
  });
  escenario.addEventListener("pointerup", (ev) => { if (!ev.target.closest("#tabla")) empezar(); });
  let temporizador = null;
  window.addEventListener("pointermove", () => {
    escenario.classList.remove("sin-cursor");
    clearTimeout(temporizador);
    temporizador = setTimeout(() => escenario.classList.add("sin-cursor"), 2000);
  });
  let pendiente = null;
  window.addEventListener("resize", () => { clearTimeout(pendiente); pendiente = setTimeout(redimensionar, 180); });

  redimensionar();
  recontar();
  requestAnimationFrame(cuadro);
  setTimeout(intentarArranqueSolo, 600);
})();
</script>
